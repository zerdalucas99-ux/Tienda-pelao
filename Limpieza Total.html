<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limpieza Total</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: lista de precios en filas a la izquierda, carrito fijo a la derecha (en celular, panel inferior). */
:root{
  --bg:#eef1ed;
  --surface:#ffffff;
  --ink:#16231d;
  --muted:#5d6b63;
  --line:#d5dcd6;
  --accent:#d9481f;
  --accent-ink:#ffffff;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101713;--surface:#18221c;--ink:#e8efe9;--muted:#98a69d;--line:#2a372f;--accent:#ff7a4d;--accent-ink:#1a0c06;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101713;--surface:#18221c;--ink:#e8efe9;--muted:#98a69d;--line:#2a372f;--accent:#ff7a4d;--accent-ink:#1a0c06;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.top{padding:28px 0 18px;border-bottom:2px solid var(--ink)}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,3.4rem);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);margin:0}

.tools{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}
.search{flex:1 1 220px;min-width:0;padding:11px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start;padding-bottom:110px}
.cat{font-family:var(--display);font-weight:600;font-size:1.05rem;text-transform:uppercase;letter-spacing:.08em;margin:22px 0 4px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:14px 0;border-bottom:1px dashed var(--line)}
.thumb{width:72px;height:72px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:2rem;color:#fff}
.name{font-weight:700;margin:0}
.desc{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.buy{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.price{font-family:var(--display);font-weight:800;font-size:1.35rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{border:0;border-radius:8px;padding:9px 14px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.qty button{width:34px;height:34px;border:0;background:transparent;cursor:pointer;font-size:1.1rem;font-weight:700}
.qty button:hover{background:var(--line)}
.qty span{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.empty{padding:32px 0;color:var(--muted)}

/* Carrito */
.cart{position:sticky;top:16px;background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:18px}
.cart h2{font-family:var(--display);font-size:1.4rem;margin:0 0 10px}
.lines{list-style:none;margin:0;padding:0;max-height:50vh;overflow:auto}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .l-name{font-weight:500}
.line .l-sum{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0;font-family:var(--display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
.actions{display:grid;gap:8px}
.actions a.btn{text-decoration:none;text-align:center;display:block}
.note{font-size:.85rem;color:var(--muted);margin:10px 0 0}
.close-cart{display:none}

.bar{display:none}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .cart{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;border-radius:16px 16px 0 0;border-width:2px 0 0;max-height:85%;overflow:auto;transform:translateY(105%);transition:transform .25s}
  .cart.open{transform:none}
  .close-cart{display:inline-block;float:right}
  .bar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:10;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer}
  .item{grid-template-columns:56px minmax(0,1fr)}
  .thumb{width:56px;height:56px;font-size:1.5rem}
  .buy{grid-column:1 / -1;flex-direction:row;justify-content:space-between;align-items:center}
}
@media (prefers-reduced-motion:reduce){.cart{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 id="shop-name">Limpieza Total</h1>
      <p class="sub">Lista de precios actualizada. Armá tu pedido y envialo por WhatsApp.</p>
    </div>
  </header>

  <div class="tools">
    <input id="q" class="search" type="search" placeholder="Buscar producto" aria-label="Buscar producto">
    <div class="chips" id="chips" role="group" aria-label="Categorías"></div>
  </div>

  <div class="layout">
    <main id="catalog" aria-live="polite"></main>

    <aside class="cart" id="cart" aria-label="Carrito">
      <button class="btn ghost close-cart" id="close-cart" type="button">Cerrar</button>
      <h2>Tu carrito</h2>
      <ul class="lines" id="lines"></ul>
      <div class="total"><span>Total</span><span id="total">$0</span></div>
      <div class="actions">
        <a class="btn" id="wa" href="#" target="_blank" rel="noopener">Enviar pedido por WhatsApp</a>
        <button class="btn ghost" id="copy" type="button">Copiar pedido</button>
        <button class="btn ghost" id="clear" type="button">Vaciar carrito</button>
      </div>
      <p class="note" id="msg" role="status"></p>
    </aside>
  </div>
</div>

<button class="bar" id="bar" type="button" aria-controls="cart">
  <span id="bar-count">Carrito (0)</span><span id="bar-total">$0</span>
</button>

<script>
/* ====== CONFIGURACIÓN: cambiá esto por tus datos ====== */
const SHOP_NAME = "Limpieza Total";
const WHATSAPP = "5491100000000"; // código de país + área + número, sin + ni espacios
const PRODUCTS = [
  {id:1,  cat:"Pisos y superficies", name:"Limpiador de pisos 900 ml",   desc:"Aroma lavanda. Para todo tipo de piso.",   price:2300, color:"#6b4a8a"},
  {id:2,  cat:"Pisos y superficies", name:"Limpiador multiuso 500 ml",   desc:"Gatillo. Vidrios, mesadas y azulejos.",    price:2100, color:"#2f6f8b"},
  {id:3,  cat:"Pisos y superficies", name:"Cera para pisos 1 L",         desc:"Acabado brillante, secado rápido.",        price:3600, color:"#b8860b"},
  {id:4,  cat:"Cocina",              name:"Detergente 750 ml",           desc:"Aroma limón. Alto poder desengrasante.",   price:2400, color:"#3d7d2a"},
  {id:5,  cat:"Cocina",              name:"Esponja doble faz x3",        desc:"Pack de tres unidades.",                   price:1900, color:"#a34a28"},
  {id:6,  cat:"Cocina",              name:"Desengrasante 500 ml",        desc:"Para hornallas, hornos y campanas.",       price:2900, color:"#7a4a2a"},
  {id:7,  cat:"Baño",                name:"Lavandina 1 L",               desc:"Concentrada.",                             price:1350, color:"#4a5f8a"},
  {id:8,  cat:"Baño",                name:"Limpiador de baño 500 ml",    desc:"Antisarro, con gatillo.",                  price:2700, color:"#1f6f8b"},
  {id:9,  cat:"Baño",                name:"Destapacañerías 1 L",         desc:"Gel. Uso en cañerías y piletas.",          price:3200, color:"#7a1f2b"},
  {id:10, cat:"Ropa",                name:"Jabón líquido para ropa 3 L", desc:"Baja espuma. Apto lavarropas.",            price:7800, color:"#3d6fb0"},
  {id:11, cat:"Ropa",                name:"Suavizante 900 ml",           desc:"Aroma floral, doypack.",                   price:3100, color:"#a14a7a"},
  {id:12, cat:"Accesorios",          name:"Trapo de piso x2",            desc:"Algodón absorbente.",                      price:2200, color:"#5d6b63"},
  {id:13, cat:"Accesorios",          name:"Escoba y pala",               desc:"Cerdas suaves, mango largo.",              price:6500, color:"#8a6a12"},
  {id:14, cat:"Accesorios",          name:"Guantes de látex M",          desc:"Par, uso doméstico.",                      price:1600, color:"#c4552b"},
  {id:15, cat:"Desinfección",        name:"Desinfectante aerosol 360 ml", desc:"Elimina el 99,9% de las bacterias.",      price:4200, color:"#2f6b4f"},
  {id:16, cat:"Desinfección",        name:"Alcohol en gel 500 ml",       desc:"Con válvula dosificadora.",                price:2600, color:"#16231d"}
];
/* ======================================================= */

const fmt = n => new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n);
const $ = id => document.getElementById(id);
let cart = {};          // id -> cantidad
let cat = "Todos";
let query = "";

try { cart = JSON.parse(localStorage.getItem("tienda-carrito") || "{}") || {}; } catch(e) { cart = {}; }
const save = () => { try { localStorage.setItem("tienda-carrito", JSON.stringify(cart)); } catch(e) {} };

document.title = SHOP_NAME;
$("shop-name").textContent = SHOP_NAME;

const cats = ["Todos", ...new Set(PRODUCTS.map(p => p.cat))];
function renderChips(){
  $("chips").innerHTML = cats.map(c =>
    `<button type="button" class="chip" data-cat="${c}" aria-pressed="${c===cat}">${c}</button>`).join("");
}

function buyControl(p){
  const q = cart[p.id] || 0;
  if(!q) return `<button class="btn" type="button" data-add="${p.id}">Agregar</button>`;
  return `<div class="qty"><button type="button" data-dec="${p.id}" aria-label="Quitar uno de ${p.name}">−</button><span>${q}</span><button type="button" data-add="${p.id}" aria-label="Agregar uno de ${p.name}">+</button></div>`;
}

function renderCatalog(){
  const term = query.trim().toLowerCase();
  const shown = PRODUCTS.filter(p => (cat==="Todos"||p.cat===cat) && (!term || (p.name+" "+p.desc).toLowerCase().includes(term)));
  if(!shown.length){ $("catalog").innerHTML = `<p class="empty">No encontramos productos con esa búsqueda.</p>`; return; }
  let html = "";
  [...new Set(shown.map(p => p.cat))].forEach(c => {
    html += `<h2 class="cat">${c}</h2><ul class="list">` +
      shown.filter(p => p.cat===c).map(p => `
      <li class="item">
        <div class="thumb" style="background:${p.color}" aria-hidden="true">${p.name[0]}</div>
        <div><p class="name">${p.name}</p><p class="desc">${p.desc}</p></div>
        <div class="buy"><span class="price">${fmt(p.price)}</span>${buyControl(p)}</div>
      </li>`).join("") + `</ul>`;
  });
  $("catalog").innerHTML = html;
}

function totals(){
  let count = 0, sum = 0;
  PRODUCTS.forEach(p => { const q = cart[p.id]||0; count += q; sum += q*p.price; });
  return {count, sum};
}

function orderText(){
  const rows = PRODUCTS.filter(p => cart[p.id]).map(p => `- ${cart[p.id]} x ${p.name} (${fmt(p.price)} c/u) = ${fmt(cart[p.id]*p.price)}`);
  return `Hola! Quiero hacer este pedido en ${SHOP_NAME}:\n${rows.join("\n")}\nTotal: ${fmt(totals().sum)}`;
}

function renderCart(){
  const {count, sum} = totals();
  const items = PRODUCTS.filter(p => cart[p.id]);
  $("lines").innerHTML = items.length ? items.map(p => `
    <li class="line">
      <span class="l-name">${p.name}</span><span class="l-sum">${fmt(cart[p.id]*p.price)}</span>
      <div class="qty"><button type="button" data-dec="${p.id}" aria-label="Quitar uno de ${p.name}">−</button><span>${cart[p.id]}</span><button type="button" data-add="${p.id}" aria-label="Agregar uno de ${p.name}">+</button></div>
      <button class="btn ghost" type="button" data-del="${p.id}" aria-label="Eliminar ${p.name}">Quitar</button>
    </li>`).join("") : `<li class="empty">Todavía no agregaste productos.</li>`;
  $("total").textContent = fmt(sum);
  $("bar-count").textContent = `Carrito (${count})`;
  $("bar-total").textContent = fmt(sum);
  const wa = $("wa");
  wa.href = count ? `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(orderText())}` : "#";
  wa.setAttribute("aria-disabled", count ? "false" : "true");
  wa.style.opacity = count ? 1 : .45;
  wa.style.pointerEvents = count ? "auto" : "none";
  $("copy").disabled = !count; $("clear").disabled = !count;
}

function change(id, d){
  const q = Math.max(0, (cart[id]||0) + d);
  if(q) cart[id] = q; else delete cart[id];
  save(); renderCatalog(); renderCart();
}

document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if(!t) return;
  if(t.dataset.add) change(+t.dataset.add, 1);
  else if(t.dataset.dec) change(+t.dataset.dec, -1);
  else if(t.dataset.del){ delete cart[t.dataset.del]; save(); renderCatalog(); renderCart(); }
  else if(t.dataset.cat){ cat = t.dataset.cat; renderChips(); renderCatalog(); }
});
$("q").addEventListener("input", e => { query = e.target.value; renderCatalog(); });
$("clear").addEventListener("click", () => { cart = {}; save(); renderCatalog(); renderCart(); $("msg").textContent = ""; });
$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(orderText()); $("msg").textContent = "Pedido copiado. Pegalo en el chat que prefieras."; }
  catch(e){ $("msg").textContent = "No se pudo copiar. Usá el botón de WhatsApp."; }
});
$("bar").addEventListener("click", () => $("cart").classList.add("open"));
$("close-cart").addEventListener("click", () => $("cart").classList.remove("open"));

renderChips(); renderCatalog(); renderCart();
</script>
</body>
</html>
